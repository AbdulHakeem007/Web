<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 Task 3 - Student Management System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f0f3f4; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .form-section { background: #ecf0f1; padding: 20px; border-radius: 10px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50; }
        input { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 1rem; }
        input:focus { outline: none; border-color: #3498db; }
        .btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 10px; transition: all 0.3s; }
        .btn-primary { background: #3498db; color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-warning:hover { background: #e67e22; }
        .student-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; transition: transform 0.3s; }
        .student-card:hover { transform: translateY(-3px); }
        .student-card h3 { margin-bottom: 10px; font-size: 1.4rem; }
        .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grade-display { font-size: 2rem; font-weight: bold; text-align: center; margin-top: 10px; }
        .grade-A { color: #2ecc71; }
        .grade-B { color: #f1c40f; }
        .grade-C { color: #e67e22; }
        .grade-F { color: #e74c3c; }
        .stats { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .stats h3 { margin-bottom: 10px; }
        .log-box { background: #1a1a2e; color: #00ff88; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; max-height: 200px; overflow-y: auto; margin-top: 20px; }
        .log-box p { margin: 3px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Student Management System</h1>
        <p class="subtitle">Lab 4 Task 3 - JavaScript Objects & Data Types</p>

        <!-- Add Student Form -->
        <div class="form-section">
            <h2>Add New Student</h2>
            <div class="form-group">
                <label for="sName">Name (String):</label>
                <input type="text" id="sName" placeholder="Enter student name">
            </div>
            <div class="form-group">
                <label for="sAge">Age (Number):</label>
                <input type="number" id="sAge" placeholder="Enter age">
            </div>
            <div class="form-group">
                <label for="sMarks">Marks (Number, 0-100):</label>
                <input type="number" id="sMarks" placeholder="Enter marks" max="100" min="0">
            </div>
            <div class="form-group">
                <label for="sCourse">Course (String):</label>
                <input type="text" id="sCourse" placeholder="Enter course name">
            </div>
            <div class="form-group">
                <label for="sActive">Active Status (Boolean - true/false):</label>
                <input type="text" id="sActive" placeholder="Enter true or false">
            </div>
            <button class="btn btn-primary" onclick="addStudent()">➕ Add Student</button>
            <button class="btn btn-success" onclick="displayAllStudents()">📋 Show All Students</button>
            <button class="btn btn-warning" onclick="clearAll()">🗑️ Clear All</button>
        </div>

        <!-- Update Marks Section -->
        <div class="form-section">
            <h2>Update Student Marks</h2>
            <div class="form-group">
                <label for="updateIndex">Student Index (0-based):</label>
                <input type="number" id="updateIndex" placeholder="Enter index number" min="0">
            </div>
            <div class="form-group">
                <label for="newMarks">New Marks:</label>
                <input type="number" id="newMarks" placeholder="Enter new marks" max="100" min="0">
            </div>
            <button class="btn btn-warning" onclick="updateMarks()">✏️ Update Marks</button>
        </div>

        <!-- Display Area -->
        <div id="display-area"></div>

        <!-- Statistics -->
        <div class="stats" id="stats-area"></div>

        <!-- Console Log -->
        <div class="log-box" id="log-box">
            <p>> System initialized...</p>
        </div>
    </div>

    <script>
        // ============================================
        // LAB 4 TASK 3: Student Management
        // Demonstrates: String, Number, Boolean, Object, Array
        // ============================================

        const logBox = document.getElementById('log-box');
        const displayArea = document.getElementById('display-area');
        const statsArea = document.getElementById('stats-area');

        // Array to store multiple student objects
        let students = [];

        // Logging function
        function log(message) {
            console.log(message);
            const p = document.createElement('p');
            p.textContent = `> ${message}`;
            logBox.appendChild(p);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Student Object Constructor/Factory
        function createStudent(name, age, marks, course, isActive) {
            // Demonstrating different datatypes:
            // String: name, course
            // Number: age, marks
            // Boolean: isActive
            // Object: the student itself
            // Array: skills (demonstrating array within object)

            const student = {
                name: String(name),           // String datatype
                age: Number(age),             // Number datatype
                marks: Number(marks),         // Number datatype
                course: String(course),       // String datatype
                isActive: isActive === 'true' || isActive === true, // Boolean datatype
                skills: ['HTML', 'CSS', 'JS'], // Array datatype within object
                enrollmentDate: new Date(),    // Date object

                // Method to calculate grade based on marks
                calculateGrade: function() {
                    if (this.marks >= 90) return 'A';
                    else if (this.marks >= 80) return 'B';
                    else if (this.marks >= 70) return 'C';
                    else if (this.marks >= 60) return 'D';
                    else return 'F';
                },

                // Method to get full info
                getInfo: function() {
                    return `${this.name} (${this.age} years) - ${this.course}: ${this.marks} marks`;
                }
            };

            return student;
        }

        // Add Student Function
        function addStudent() {
            // Get values from form
            const name = document.getElementById('sName').value;
            const age = document.getElementById('sAge').value;
            const marks = document.getElementById('sMarks').value;
            const course = document.getElementById('sCourse').value;
            const isActive = document.getElementById('sActive').value;

            // Validation
            if (!name || !age || marks === '' || !course || !isActive) {
                alert('Please fill all fields!');
                log('ERROR: Empty fields detected');
                return;
            }

            // Create student object
            const student = createStudent(name, age, marks, course, isActive);

            // Add to array
            students.push(student);

            // Log datatype information
            log(`ADDED: ${student.name}`);
            log(`  - name: ${typeof student.name} (String)`);
            log(`  - age: ${typeof student.age} (Number)`);
            log(`  - marks: ${typeof student.marks} (Number)`);
            log(`  - course: ${typeof student.course} (String)`);
            log(`  - isActive: ${typeof student.isActive} (Boolean)`);
            log(`  - skills: ${typeof student.skills} (Array)`);
            log(`  - student: ${typeof student} (Object)`);
            log(`  - Grade: ${student.calculateGrade()}`);
            log(`  - Total students: ${students.length}`);

            // Clear form
            document.getElementById('sName').value = '';
            document.getElementById('sAge').value = '';
            document.getElementById('sMarks').value = '';
            document.getElementById('sCourse').value = '';
            document.getElementById('sActive').value = '';

            displayAllStudents();
        }

        // Display All Students
        function displayAllStudents() {
            displayArea.innerHTML = '';

            if (students.length === 0) {
                displayArea.innerHTML = '<p style="text-align:center; color:#7f8c8d;">No students added yet.</p>';
                statsArea.innerHTML = '';
                return;
            }

            students.forEach((student, index) => {
                const grade = student.calculateGrade();
                let gradeClass = '';
                if (grade === 'A') gradeClass = 'grade-A';
                else if (grade === 'B') gradeClass = 'grade-B';
                else if (grade === 'C') gradeClass = 'grade-C';
                else gradeClass = 'grade-F';

                const card = document.createElement('div');
                card.className = 'student-card';
                card.innerHTML = `
                    <h3>👤 ${student.name} <small style="font-size:0.8rem;">[Index: ${index}]</small></h3>
                    <div class="student-info">
                        <div><strong>Age:</strong> ${student.age} (Number)</div>
                        <div><strong>Course:</strong> ${student.course} (String)</div>
                        <div><strong>Marks:</strong> ${student.marks} (Number)</div>
                        <div><strong>Active:</strong> ${student.isActive} (Boolean)</div>
                        <div><strong>Skills:</strong> ${student.skills.join(', ')} (Array)</div>
                        <div><strong>Enrolled:</strong> ${student.enrollmentDate.toLocaleDateString()}</div>
                    </div>
                    <div class="grade-display ${gradeClass}">Grade: ${grade}</div>
                    <button class="btn btn-warning" onclick="updateMarksByIndex(${index})" style="margin-top:10px;">Update Marks</button>
                `;
                displayArea.appendChild(card);
            });

            updateStats();
            log(`Displayed ${students.length} students`);
        }

        // Update Marks by Index from form
        function updateMarks() {
            const index = parseInt(document.getElementById('updateIndex').value);
            const newMarks = parseFloat(document.getElementById('newMarks').value);

            if (isNaN(index) || isNaN(newMarks)) {
                alert('Please enter valid index and marks!');
                return;
            }

            if (index < 0 || index >= students.length) {
                alert(`Invalid index! Must be between 0 and ${students.length - 1}`);
                return;
            }

            const oldMarks = students[index].marks;
            students[index].marks = newMarks;
            const newGrade = students[index].calculateGrade();

            log(`UPDATED: ${students[index].name}`);
            log(`  - Old marks: ${oldMarks} → New marks: ${newMarks}`);
            log(`  - New Grade: ${newGrade}`);

            displayAllStudents();

            document.getElementById('updateIndex').value = '';
            document.getElementById('newMarks').value = '';
        }

        // Quick update from card button
        function updateMarksByIndex(index) {
            document.getElementById('updateIndex').value = index;
            document.getElementById('newMarks').focus();
            log(`Selected student at index ${index}: ${students[index].name}`);
        }

        // Update Statistics
        function updateStats() {
            if (students.length === 0) return;

            const totalMarks = students.reduce((sum, s) => sum + s.marks, 0);
            const avgMarks = (totalMarks / students.length).toFixed(2);
            const activeCount = students.filter(s => s.isActive).length;

            statsArea.innerHTML = `
                <h3>📊 Class Statistics</h3>
                <p>Total Students: ${students.length} | Average Marks: ${avgMarks} | Active Students: ${activeCount}</p>
            `;
        }

        // Clear All
        function clearAll() {
            if (confirm('Are you sure you want to clear all students?')) {
                students = [];
                displayArea.innerHTML = '';
                statsArea.innerHTML = '';
                log('All students cleared');
            }
        }

        // Initial sample data to demonstrate functionality
        log('Adding sample students for demonstration...');
        students.push(createStudent('Ali Khan', 20, 85, 'Web Engineering', true));
        students.push(createStudent('Sara Ahmad', 21, 92, 'Database Systems', true));
        students.push(createStudent('John Doe', 19, 65, 'Programming Fundamentals', false));
        log('Sample data loaded: 3 students');
        displayAllStudents();
    </script>
</body>
</html>
