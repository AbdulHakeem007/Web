<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 Task 6 - Personal Photo Album</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; border: 3px solid #666; border-radius: 5px; overflow: hidden; }
        h1 { text-align: center; padding: 20px; margin: 0; border-bottom: 2px solid #666; }
        .controls { padding: 15px; border-bottom: 2px solid #666; background: #f9f9f9; }
        .controls button { padding: 8px 20px; margin-right: 10px; cursor: pointer; font-size: 1rem; border: 2px solid #999; background: #eee; }
        .controls button:hover { background: #ddd; }
        .controls button.active { background: #666; color: white; }
        .gallery { padding: 20px; min-height: 400px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .gallery img { max-width: 100%; height: auto; border-radius: 5px; }
        .photo-card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; text-align: center; }
        .photo-card p { margin: 5px 0 0 0; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Personal Photo Album</h1>

        <div class="controls">
            <button id="btn-birthday" class="active" onclick="showCategory('birthday')">Birthday</button>
            <button id="btn-pets" onclick="showCategory('pets')">Pets</button>
            <button id="btn-cars" onclick="showCategory('cars')">Cars</button>
        </div>

        <div class="gallery" id="gallery">
            <!-- Photos will be loaded here -->
        </div>
    </div>

    <script>
        // Photo data organized by category
        const album = {
            birthday: [
                { src: 'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=300', caption: 'Birthday Celebration' },
                { src: 'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=300', caption: 'Birthday Cake' },
                { src: 'https://images.unsplash.com/photo-1504196606672-aef5c9cefc92?w=300', caption: 'Party Time' },
                { src: 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300', caption: 'Happy Birthday' }
            ],
            pets: [
                { src: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300', caption: 'Cute Cat' },
                { src: 'https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300', caption: 'Dog Friend' },
                { src: 'https://images.unsplash.com/photo-1425082661705-1834bfd09dca?w=300', caption: 'Hamster' },
                { src: 'https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?w=300', caption: 'Turtle' }
            ],
            cars: [
                { src: 'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300', caption: 'Sports Car' },
                { src: 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=300', caption: 'Luxury Car' },
                { src: 'https://images.unsplash.com/photo-1552519507-da3b1425f357?w=300', caption: 'Classic Car' },
                { src: 'https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=300', caption: 'Super Car' }
            ]
        };

        function showCategory(category) {
            const gallery = document.getElementById('gallery');
            const buttons = document.querySelectorAll('.controls button');

            // Update button states
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + category).classList.add('active');

            // Clear gallery
            gallery.innerHTML = '';

            // Load photos for selected category
            const photos = album[category];
            photos.forEach(photo => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <img src="${photo.src}" alt="${photo.caption}" onerror="this.src='https://via.placeholder.com/300x200?text=${category}'">
                    <p>${photo.caption}</p>
                `;
                gallery.appendChild(card);
            });

            console.log('Loaded ' + category + ' category with ' + photos.length + ' photos');
        }

        // Show birthday by default
        showCategory('birthday');
    </script>
</body>
</html>
